name: Verify reader

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reader:
    name: Reader and mobile acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run verify:browser
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-review-evidence
          path: .test-output
          include-hidden-files: true
          retention-days: 14
      - name: Save verified site
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist
          retention-days: 7
