name: Verify reader

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reader:
    name: Reader and mobile acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install local media validator
        run: sudo apt-get install -y ffmpeg
      - run: npm run verify
      - run: npm run verify:browser
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-review-evidence
          path: .test-output
          include-hidden-files: true
          retention-days: 14
      - name: Save verified site
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist
          retention-days: 7

  hosted_renderer_diagnostic:
    name: Hosted renderer diagnostic (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            variants: default,new-headless-enable-gpu
          - os: windows-latest
            label: windows
            variants: default,new-headless-enable-gpu,d3d11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Inspect actual hosted WebGL backend
        continue-on-error: true
        run: node scripts/renderer-check.mjs
        env:
          RENDERER_VARIANTS: ${{ matrix.variants }}
      - name: Save hosted renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-diagnostic-${{ matrix.label }}
          path: .test-output/renderer-diagnostic
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
