name: Verify reader

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reader:
    name: Reader and mobile acceptance
    runs-on: [self-hosted, macOS, ARM64, lll-reviewed-gpu]
    timeout-minutes: 30
    env:
      READER_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check GPU runner prerequisites
        run: |
          command -v ffmpeg
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - run: npm run verify
      - run: npm run verify:browser
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-review-evidence
          path: .test-output
          include-hidden-files: true
          retention-days: 14
      - name: Save verified site
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist
          retention-days: 7
