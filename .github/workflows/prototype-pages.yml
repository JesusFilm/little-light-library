name: Publish portrait prototype

on:
  push:
    branches: [codex/portrait-story-prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prototype:
    if: github.ref == 'refs/heads/codex/portrait-story-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media validator and test browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Verify the portrait prototype
        run: node scripts/portrait-prototype-check.mjs
      - name: Save prototype screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-prototype-review
          path: .test-output/portrait-prototype
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
